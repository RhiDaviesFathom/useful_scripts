version: 2

# fathom-pyutils lives in GCP Artifact Registry. Dependabot authenticates with a
# service-account key, stored as the Dependabot secret ARTIFACT_REGISTRY_KEY_BASE64
# (Settings -> Secrets and variables -> Dependabot). The account only needs the
# Artifact Registry Reader role.
registries:
  private-registry:
    type: python-index
    url: https://us-central1-python.pkg.dev/fathom-pyutils/fathom-pyutils/simple/
    username: _json_key_base64
    password: ${{ secrets.ARTIFACT_REGISTRY_KEY_BASE64 }}

updates:
  - package-ecosystem: uv
    directory: /
    registries:
      - private-registry
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    # Minor and patch bumps land as one PR per group. Major bumps get their own
    # PR so breaking changes are reviewed on their own.
    groups:
      runtime:
        dependency-type: production
        update-types: [minor, patch]
      dev:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ["*"]
