name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true

      - name: Ruff lint
        run: uvx ruff check --output-format=github

      - name: Ruff format
        run: uvx ruff format --check

      # fathom-pyutils lives in a private registry that CI cannot reach, so skip
      # installing it. ty still checks everything else against the public deps.
      - name: Install public dependencies
        run: >-
          uv sync --frozen
          --no-install-package fathom-pyutils
          --no-install-package fathom-pyutils-core

      - name: ty
        run: uv run --no-sync ty check --ignore unresolved-import
