[build-system]
build-backend = "uv_build"
requires = [ "uv-build>=0.12,<0.14" ]

[project]
name = "useful-scripts"
version = "0.1.0"
description = "Count the unique Fathom tiles covered by a CSV of coordinates."
readme = "README.md"
requires-python = ">=3.13"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]
dependencies = [
  "click>=8.5",
  "pandas>=3.0.6",
]
scripts.num-tiles = "geometry_logic.num_tiles:main"

[dependency-groups]
dev = [
  "pre-commit>=4.7",
  "pytest>=9.2",
  "pytest-cov>=7.1",
  "ruff>=0.17.3",
  "ty>=0.0.96",
]

[tool.uv]
build-backend.module-name = "geometry_logic"

[tool.ruff]
target-version = "py313"
line-length = 88
src = [ "src", "tests" ]
lint.select = [
  "ANN", # flake8-annotations
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "D",   # pydocstyle
  "E",   # pycodestyle errors
  "ERA", # commented-out code
  "F",   # pyflakes
  "G",   # flake8-logging-format
  "I",   # isort
  "LOG", # flake8-logging
  "N",   # pep8-naming
  "PT",  # flake8-pytest-style
  "PTH", # flake8-use-pathlib
  "RUF", # ruff-specific
  "S",   # flake8-bandit
  "SIM", # flake8-simplify
  "UP",  # pyupgrade
  "W",   # pycodestyle warnings
]
lint.per-file-ignores."tests/**" = [ "ANN", "D", "S101" ]
lint.pydocstyle.convention = "google"

[tool.ty]
src.include = [ "src", "tests" ]
environment.python-version = "3.13"

[tool.pytest]
ini_options.testpaths = [ "tests" ]
ini_options.addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "--import-mode=importlib",
  "--cov=geometry_logic",
  "--cov-report=term-missing",
]
ini_options.xfail_strict = true

[tool.coverage]
run.branch = true
report.fail_under = 90
report.show_missing = true
